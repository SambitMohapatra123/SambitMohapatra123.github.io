<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Portfolio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #000;
      color: white;
      cursor: none;
      overflow-x: hidden;
    }

    #backgroundCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    #cursorEffect {
      position: fixed;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      border: 3px solid cyan;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
      z-index: 3;
    }

    #navButtons {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 5;
      display: flex;
      gap: 15px;
    }

    #navButtons button {
      padding: 10px 20px;
      font-size: 0.95em;
      font-weight: bold;
      background: cyan;
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px cyan;
      transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    }

    #navButtons button:hover {
      background: #00ffff;
      transform: scale(1.08);
      box-shadow: 0 0 25px cyan;
    }

    #contactContent {
      position: relative;
      z-index: 2;
      max-width: 600px;
      margin: 150px auto 50px auto;
      padding: 30px;
      background: rgba(0,0,0,0.6);
      border: 3px solid cyan;
      border-radius: 15px;
      box-shadow: 0 0 20px cyan;
      text-align: center;
    }

    #contactContent h1 {
      font-size: 2.5em;
      text-shadow: 0 0 15px cyan;
      margin-bottom: 30px;
    }

    #contactContent p {
      font-size: 1.2em;
      margin-bottom: 15px;
    }

    #contactContent a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 1em;
      font-weight: bold;
      background: cyan;
      color: black;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 0 20px cyan;
      transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    }

    #contactContent a:hover {
      background: #00ffff;
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
    }

  </style>
</head>
<body>
  <canvas id="backgroundCanvas"></canvas>
  <div id="cursorEffect"></div>

  <div id="navButtons">
    <button onclick="window.location.href='projects.html'">Projects</button>
    <button onclick="window.location.href='about.html'">About</button>
    <button onclick="window.location.href='contact.html'">Contact</button>
  </div>

  <div id="contactContent">
    <h1>📬 Contact Me</h1>
    <p>Email: <a href="mailto:sambitmohapatra777@gmail.com">sambitmohapatra777@gmail.com</a></p>
    <p>Phone: <a href="tel:+918260725511">+91 8260725511</a></p>
  </div>

  <script>
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 150;

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
        this.color = 'cyan';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width || this.x < 0 || this.y > canvas.height || this.y < 0) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    function initParticles() {
      for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    }

    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const distance = Math.sqrt(dx*dx + dy*dy);
          if(distance < 100){
            ctx.strokeStyle = 'rgba(0,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateParticles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{p.update();p.draw();});
      connectParticles();
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('mousemove', e=>{
      document.getElementById('cursorEffect').style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    });

    window.addEventListener('resize', ()=>{
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    initParticles();
    animateParticles();
  </script>
</body>
</html>
