<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio | Sambit Mohapatra</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #000;
      color: white;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
      cursor: none;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      z-index: 2;
      position: relative;
      text-align: center;
      padding: 100px 20px 30px;
    }
    header h1 {
      font-size: 3em;
      text-shadow: 0 0 15px cyan;
    }
    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1em;
      margin: 30px 0;
      z-index: 2;
      position: relative;
    }
    nav button, .back-button {
      padding: 0.8em 1.5em;
      font-size: 1em;
      cursor: pointer;
      background: cyan;
      border: none;
      border-radius: 10px;
      color: black;
      transition: transform 0.3s, background 0.3s;
      box-shadow: 0 0 20px cyan;
    }
    nav button:hover, .back-button:hover {
      background: #00ffff;
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 1em;
      color: cyan;
      z-index: 2;
      position: relative;
      margin-top: auto;
    }

    .mouse-circle {
      position: fixed;
      border: 3px solid rgba(0,255,255,0.3);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      pointer-events: none;
      z-index: 9999;
      transition: all 0.1s ease-out;
    }
  </style>
</head>
<body>
  <canvas id="bgParticles"></canvas>
  <div class="mouse-circle" id="mouseEffect"></div>

  <header>
    <h1>Hey, it's SAMBIT MOHAPATRA</h1>
    <nav>
      <div id="navButtons">
    <button onclick="window.location.href='projects.html'">Projects</button>
    <button onclick="window.location.href='about.html'">About</button>
    <button onclick="window.location.href='contact.html'">Contact</button>
  </div>
    </nav>
  </header>

  <footer>
    <button class="back-button" onclick="goBack()">Back to Entry Page</button>
    <br><br>
    &copy; 2025 Sambit Mohapatra. All rights reserved.
  </footer>

  <script>
    function scrollToSection(id) {
      alert(id + ' section coming soon!');
    }

    function goBack() {
      window.location.href = 'index.html';
    }

    const canvas = document.getElementById('bgParticles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 150;

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
        this.color = 'cyan';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width || this.x < 0 || this.y > canvas.height || this.y < 0) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    function initParticles() {
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 100) {
            ctx.strokeStyle = 'rgba(0,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      connectParticles();
      drawMouseEffect();
      requestAnimationFrame(animateParticles);
    }

    function drawMouseEffect() {
      if (mouse.x && mouse.y) {
        const circle = document.getElementById('mouseEffect');
        circle.style.left = `${mouse.x - 30}px`;
        circle.style.top = `${mouse.y - 30}px`;
      }
    }

    const mouse = { x: null, y: null };
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    initParticles();
    animateParticles();
  </script>
</body>
</html>
